  - intent: special_examination
    examples: |
      - Tell me about special examinations.
      - What is the procedure for special examinations?
      - How are special examinations conducted?
      - Are there any special examinations?
      - Can you explain special examinations?
      - I need information about special examinations.
      - What are the rules for special examinations?
      - How to apply for special examinations?
      - i was un able to sit in the examination because of my father death i want to give exam know whats the process 
      - What should I do if I missed an exam due to a family emergency?
      - How can I apply for a special exam after missing one?
      - What is the process for rescheduling an exam due to a personal emergency?
      - Can I take an exam later if I missed it because of a death in the family?
      - What documents are needed to apply for a special exam?
      - Who should I contact to apply for a special exam?
      - How long do I have to apply for a special exam after missing one?
      - Is there a fee for applying for a special exam?
      - What other blood relatives are considered under this policy? (e.g., grandparents, children)
      - Does the death of a close friend qualify for a special exam?
      - If my relative passed away shortly before the exam but not within the specified timeframe (e.g., 2 months), can I still apply for a special exam?
      - What specific documents do I need to submit to apply for a special exam? (Besides the affidavit)
      - How and when should I submit the affidavit?
      - Who should I contact at the Departmental Examination Committee for further clarification?
      - What is the format of the special exam? Will it be the same as the regular exam?
      - Can I choose when to take the special exam
      - Is there a deadline for applying for a special exam?
      - What happens if my application for a special exam is rejected?
      - Can I appeal the decision if my application for a special exam is rejected?

