<!DOCTYPE html>
<html lang="en">
<head>
  <title>Register page</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <script>
    function validatePassword() {
      var password = document.getElementById("pwd").value;
      var message = "";
      if (password.length < 8) {
        message = "Password must be at least 8 characters long.";
      } else if (!/[A-Z]/.test(password)) {
        message = "Password must contain at least one capital letter.";
      } else if (!/[!@#$%^&*]/.test(password)) {
        message = "Password must contain at least one symbol.";
      }
      document.getElementById("passwordMessage").innerText = message;
      return message === "";
    }
  </script>
</head>
<body>

<div class="container">
    <h1>UniSolveBot</h1>
    <h2>Sign Up</h2>
    <form action="/register" method="POST" onsubmit="return validatePassword()">
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" class="form-control" id="name" placeholder="Enter name" name="name" required>
        </div>
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" class="form-control" id="email" placeholder="Enter email" name="email" required>
            {% if email_error %}
            <small style="color:red;">{{ email_error }}</small>
            {% endif %}
        </div>
        <div class="form-group">
            <label for="pwd">Password:</label>
            <input type="password" class="form-control" id="pwd" placeholder="Enter password" name="password" required>
            <small id="passwordMessage" style="color:red;"></small>
        </div>

        <button type="submit" class="btn btn-dark">Submit</button>
        <a href="/login" class="btn btn-primary">Login</a>
    </form>
</div>

</body>
</html>
