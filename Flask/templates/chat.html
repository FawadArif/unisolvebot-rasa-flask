<!DOCTYPE html>
<html lang="en">
<head>
    <style>
    body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    background: #0d0d0d;
    color: #e8e8e8;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with UniSolveBot</title>
   
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-logo">
            <img src="{{ url_for('static', filename='must_logo.png') }}" alt="University Logo">
            <span>UniSolveBot</span>
        </div>
        <div class="navbar-links">
            <a href="/">Home</a>
            <a href="/login">Login</a>
            <a href="/register">Sign Up</a>
            <a href="/about">About</a>
        </div>
    </nav>

    <!-- Chat Interface -->
    <section class="chat-section">
        <div class="chat-container">
            <div class="chat-header">
                <h2>Chat with UniSolveBot</h2>
            </div>
            <div class="chat-messages" id="chat-messages">
                <!-- Messages will appear here -->
            </div>
            <div class="chat-input">
                <input type="text" id="user-input" placeholder="Type your message...">
                <button id="send-btn">Send</button>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <a href="/privacypolicy">Privacy Policy</a>
        <a href="/termsofservices">Terms of Service</a>
        <div class="social-media">
            <a href="https://www.facebook.com/share/SAqoywsmYb6SAtyK/"><img src="{{ url_for('static', filename='facebook-icon.png') }}" alt="Facebook"></a>
            <a href="#"><img src="{{ url_for('static', filename='twiter-icon.png') }}" alt="Twitter"></a>
            <a href="https://www.instagram.com/must_university_officially?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw=="><img src="{{ url_for('static', filename='instagram-icon.png') }}" alt="Instagram"></a>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='chat.js') }}"></script>
</body>
</html>
